<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yonder - お問い合わせ</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .container{max-width:560px;margin:0 auto;padding:32px 20px 80px;}
    .page-title{font-family:'Noto Serif JP',serif;font-size:22px;font-weight:700;color:var(--ink);margin-bottom:6px;}
    .page-sub{font-size:13px;color:var(--ink3);margin-bottom:28px;line-height:1.7;}
    .field{margin-bottom:18px;}
    .flabel{font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--ink3);text-transform:uppercase;margin-bottom:7px;display:flex;align-items:center;gap:6px;}
    .req{font-size:9px;background:#fdf2ef;color:#b85a42;border-radius:3px;padding:1px 5px;}
    .opt{font-size:9px;background:var(--acc3);color:var(--acc);border-radius:3px;padding:1px 5px;}
    input[type=text],input[type=email],select{width:100%;padding:10px 14px;border:0.5px solid var(--border);border-radius:10px;font-size:14px;color:var(--ink);background:#fff;font-family:'Zen Kaku Gothic New',sans-serif;transition:border-color .15s;appearance:none;}
    input[type=text]:focus,input[type=email]:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc2);}
    textarea{width:100%;padding:10px 14px;border:0.5px solid var(--border);border-radius:10px;font-size:14px;color:var(--ink);background:#fff;font-family:'Zen Kaku Gothic New',sans-serif;line-height:1.8;resize:vertical;min-height:140px;transition:border-color .15s;}
    .submit-btn{width:100%;padding:14px;background:var(--acc);color:#fff;border:none;border-radius:var(--r);font-family:'Noto Serif JP',serif;font-size:15px;font-weight:500;cursor:pointer;letter-spacing:.06em;transition:opacity .15s;margin-top:8px;}
    .submit-btn:hover{opacity:.88;}
    .submit-btn:disabled{opacity:.3;cursor:not-allowed;}
    .err{font-size:12px;color:#b85a42;margin-top:8px;min-height:18px;}
    .done-msg{text-align:center;padding:40px 20px;}
    .done-icon{font-size:40px;margin-bottom:16px;}
    .done-title{font-family:'Noto Serif JP',serif;font-size:18px;font-weight:500;color:var(--ink);margin-bottom:8px;}
    .done-sub{font-size:13px;color:var(--ink3);line-height:1.8;margin-bottom:24px;}
    .back-btn{display:inline-block;padding:10px 24px;border:0.5px solid var(--border);border-radius:var(--r);font-size:13px;color:var(--ink3);text-decoration:none;transition:all .15s;}
    .back-btn:hover{border-color:var(--acc2);color:var(--acc);}
  </style>
</head>
<body>
  <nav class="nav">
    <a href="index.html" class="nav-logo">Yonder<span>COMPLETED NOVELS ONLY</span></a>
    <div class="nav-tabs" id="nav-tabs">
      <a href="index.html" class="nav-tab">読む</a>
      <a href="post.html" class="nav-tab">投稿する</a>
      <a href="about.html" class="nav-tab">Yonderとは</a>
    </div>
  </nav>

  <div class="container">
    <div class="page-title">お問い合わせ</div>
    <div class="page-sub">ご質問・ご要望・不具合のご報告などお気軽にどうぞ。<br>通常2〜3営業日以内にご返信します。</div>

    <div id="form-area">
      <div class="field">
        <div class="flabel">お名前 <span class="opt">任意</span></div>
        <input type="text" id="contact-name" placeholder="例：春野 咲夜">
      </div>
      <div class="field">
        <div class="flabel">メールアドレス <span class="req">必須</span></div>
        <input type="email" id="contact-email" placeholder="your@email.com">
      </div>
      <div class="field">
        <div class="flabel">お問い合わせ種別 <span class="req">必須</span></div>
        <select id="contact-type">
          <option value="">選択してください</option>
          <option value="bug">不具合・エラーの報告</option>
          <option value="feature">機能のご要望</option>
          <option value="copyright">著作権・コンテンツに関するご相談</option>
          <option value="account">アカウントに関するご相談</option>
          <option value="delete">作品・アカウントの削除依頼</option>
          <option value="other">その他</option>
        </select>
      </div>
      <div class="field">
        <div class="flabel">お問い合わせ内容 <span class="req">必須</span></div>
        <textarea id="contact-body" placeholder="詳しい内容をご記入ください"></textarea>
      </div>
      <div class="err" id="contact-err"></div>
      <button class="submit-btn" id="contact-btn" onclick="submitContact()">送信する</button>
    </div>

    <div id="done-area" class="done-msg" style="display:none">
      <div class="done-icon">✉️</div>
      <div class="done-title">お問い合わせを受け付けました</div>
      <div class="done-sub">ご連絡いただきありがとうございます。<br>通常2〜3営業日以内にご返信します。</div>
      <a href="index.html" class="back-btn">← トップに戻る</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script>
    let currentUser = null;

    (async () => {
      const { data: { session } } = await sb.auth.getSession();
      if (session) {
        currentUser = session.user;
        document.getElementById('contact-email').value = session.user.email;
        document.getElementById('nav-tabs').innerHTML =
          '<a href="index.html" class="nav-tab">読む</a>' +
          '<a href="post.html" class="nav-tab">投稿する</a>' +
          '<a href="about.html" class="nav-tab">Yonderとは</a>' +
          '<button class="nav-tab logout" onclick="logout()">ログアウト</button>';
      }
    })();

    async function logout() { await sb.auth.signOut(); window.location.href = 'login.html'; }

    const typeLabels = {
      bug: '不具合・エラーの報告',
      feature: '機能のご要望',
      copyright: '著作権・コンテンツに関するご相談',
      account: 'アカウントに関するご相談',
      delete: '作品・アカウントの削除依頼',
      other: 'その他'
    };

    async function submitContact() {
      const name = document.getElementById('contact-name').value.trim();
      const email = document.getElementById('contact-email').value.trim();
      const type = document.getElementById('contact-type').value;
      const body = document.getElementById('contact-body').value.trim();
      const errEl = document.getElementById('contact-err');
      const btn = document.getElementById('contact-btn');

      if (!email) { errEl.textContent = 'メールアドレスを入力してください'; return; }
      if (!type) { errEl.textContent = 'お問い合わせ種別を選択してください'; return; }
      if (!body) { errEl.textContent = 'お問い合わせ内容を入力してください'; return; }

      btn.disabled = true; btn.textContent = '送信中...'; errEl.textContent = '';

      const userId = currentUser ? currentUser.id : '未ログイン';
      const userEmail = currentUser ? currentUser.email : '未ログイン';
      const pageUrl = window.location.href;
      const userAgent = navigator.userAgent;
      const now = new Date().toLocaleString('ja-JP', { timeZone: 'Asia/Tokyo' });

      const emailBody =
        '【Yonder お問い合わせ】\n\n' +
        '種別: ' + (typeLabels[type] || type) + '\n' +
        'お名前: ' + (name || '未記入') + '\n' +
        '返信先メール: ' + email + '\n\n' +
        '--- お問い合わせ内容 ---\n' +
        body + '\n\n' +
        '--- システム情報 ---\n' +
        '送信日時: ' + now + '\n' +
        'ユーザーID: ' + userId + '\n' +
        'ログインメール: ' + userEmail + '\n' +
        'ページURL: ' + pageUrl + '\n' +
        'ブラウザ: ' + userAgent;

      try {
        const res = await fetch('/api/contact', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, type, body, userId, userEmail, pageUrl, userAgent, now })
        });

        if (!res.ok) throw new Error('送信失敗');

        document.getElementById('form-area').style.display = 'none';
        document.getElementById('done-area').style.display = 'block';
      } catch(e) {
        errEl.textContent = '送信に失敗しました。しばらくしてからもう一度お試しください。';
        btn.disabled = false; btn.textContent = '送信する';
      }
    }
  </script>
</body>
</html>
