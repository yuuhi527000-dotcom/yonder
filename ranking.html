<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>読者ランキング - Yonder</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
  <style>
    html,body{height:100%;margin:0;padding:0;}
    body{display:flex;flex-direction:column;background:var(--bg);}
    .main{flex:1;overflow-y:auto;padding-bottom:72px;max-width:640px;margin:0 auto;width:100%;}
    .page-body{padding:16px 16px 24px;}
    .page-title{font-family:'Noto Serif JP',serif;font-size:18px;font-weight:500;color:var(--ink);margin-bottom:2px;}
    .page-sub{font-size:11px;color:var(--ink3);margin-bottom:16px;}

    /* ランキングカード */
    .rank-card{display:flex;align-items:center;gap:12px;padding:12px 14px;background:#fff;border:0.5px solid var(--border);border-radius:12px;margin-bottom:8px;transition:border-color .15s;}
    .rank-card.rank-me{border-color:var(--acc2);background:#fffbf7;}
    .rank-num{font-family:'Noto Serif JP',serif;font-size:20px;font-weight:700;color:var(--ink3);width:28px;text-align:center;flex-shrink:0;line-height:1;}
    .rank-num.top1{color:#c9a227;}
    .rank-num.top2{color:#8e9aaf;}
    .rank-num.top3{color:#a0674b;}
    .rank-info{flex:1;min-width:0;}
    .rank-name{font-size:13px;font-weight:500;color:var(--ink);margin-bottom:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .rank-booker{font-size:10px;color:var(--ink3);}
    .rank-lv{font-size:11px;color:var(--acc);font-weight:500;}
    .rank-right{text-align:right;flex-shrink:0;}
    .rank-chars{font-size:13px;font-weight:500;color:var(--ink);}
    .rank-unit{font-size:10px;color:var(--ink3);}
    .me-badge{display:inline-block;font-size:9px;background:var(--acc3);color:var(--acc);border-radius:4px;padding:1px 5px;margin-left:5px;vertical-align:middle;}
    .rank-divider{border:none;border-top:0.5px dashed var(--border);margin:8px 0;}

    /* 自分のカードが圏外のとき */
    .my-stat-bar{background:#fff;border:0.5px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:16px;}
    .my-stat-row{display:flex;gap:0;margin-bottom:10px;}
    .my-stat-item{flex:1;text-align:center;}
    .my-stat-n{font-family:'Noto Serif JP',serif;font-size:20px;font-weight:500;color:var(--ink);}
    .my-stat-l{font-size:10px;color:var(--ink3);margin-top:2px;}
    .lv-progress{margin-top:8px;}
    .lv-bar-track{height:5px;background:var(--border);border-radius:3px;overflow:hidden;margin:5px 0;}
    .lv-bar-fill{height:100%;background:var(--acc);border-radius:3px;transition:width .6s cubic-bezier(.4,0,.2,1);}
    .lv-bar-label{display:flex;justify-content:space-between;font-size:10px;color:var(--ink3);}

    /* ローディング・空 */
    .rank-loading{text-align:center;padding:40px 20px;font-size:13px;color:var(--ink3);}

    /* タブバー */
    .tab-bar{display:flex;border-top:0.5px solid var(--border);background:#fff;flex-shrink:0;position:fixed;bottom:0;left:0;right:0;z-index:100;}
    .tab-item{flex:1;padding:12px 0 16px;text-align:center;font-size:13px;color:var(--ink3);display:flex;flex-direction:column;align-items:center;gap:6px;border:none;background:none;font-family:'Zen Kaku Gothic New',sans-serif;cursor:pointer;transition:color .15s;}
    .tab-item i{font-size:28px;}
    .tab-item.active{color:var(--acc);}

    /* PC 2カラム */
    @media(min-width:720px){
      body{flex-direction:column;}
      .tab-bar{display:none !important;}
      .main{max-width:100%;padding-bottom:0;}
      .pc-layout{display:grid;grid-template-columns:280px 1fr;gap:0;min-height:calc(100vh - 52px);}
      .pc-left{border-right:0.5px solid var(--border);padding:20px 18px;position:sticky;top:52px;height:calc(100vh - 52px);overflow-y:auto;}
      .pc-right{padding:20px 24px;}
      nav.nav{display:flex !important;}
    }
    @media(max-width:719px){
      .pc-layout{display:block;}
      .pc-left{padding:16px 16px 0;}
      .pc-right{padding:0 16px 24px;}
      nav.nav .nav-pc-link{display:none;}
    }
  </style>
</head>
<body>
  <nav class="nav">
    <a href="index.html" class="nav-logo">Yonder<small>COMPLETED NOVELS ONLY</small></a>
    <div style="display:flex;align-items:center;gap:20px;">
      <a href="index.html" class="nav-pc-link">読む</a>
      <a href="ranking.html" class="nav-pc-link active">ランキング</a>
      <a href="post.html" class="nav-pc-link">投稿</a>
      <a href="dashboard.html" class="nav-pc-link">統計</a>
      <button class="logout-btn" onclick="logout()">ログアウト</button>
    </div>
  </nav>

  <div class="main">
    <div class="pc-layout">
      <!-- 左カラム：自分の情報 -->
      <div class="pc-left">
        <div id="my-stat-area"><div class="rank-loading" style="padding:20px 0;">読み込み中...</div></div>
      </div>
      <!-- 右カラム：ランキング一覧 -->
      <div class="pc-right">
        <div class="page-title">読者ランキング</div>
        <div class="page-sub">読んだ文字数の合計で順位が決まります　毎日0:00更新</div>
        <div id="ranking-list"><div class="rank-loading">読み込み中...</div></div>
      </div>
    </div>
  </div>

  <nav class="tab-bar">
    <button class="tab-item" onclick="location.href='index.html'"><i class="ti ti-book" aria-hidden="true"></i>読む</button>
    <button class="tab-item active"><i class="ti ti-trophy" aria-hidden="true"></i>ランキング</button>
    <button class="tab-item" onclick="location.href='post.html'"><i class="ti ti-upload" aria-hidden="true"></i>投稿</button>
    <button class="tab-item" onclick="location.href='dashboard.html'"><i class="ti ti-chart-bar" aria-hidden="true"></i>統計</button>
  </nav>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/ranking.js"></script>
</body>
</html>
