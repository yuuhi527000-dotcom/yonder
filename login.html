<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yonder - ログイン</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    body{display:flex;align-items:center;justify-content:center;padding:20px;}
    .card{width:100%;max-width:400px;background:#fff;border:0.5px solid var(--border);border-radius:20px;overflow:hidden;}
    .card-head{padding:28px 24px 0;text-align:center;}
    .logo{font-family:'Noto Serif JP',serif;font-size:28px;font-weight:700;color:var(--acc);}
    .logo-sub{font-size:11px;color:var(--ink3);letter-spacing:.15em;margin-top:4px;}
    .tagline{font-size:12px;color:var(--ink3);margin-top:12px;line-height:1.7;}
    .tabs{display:flex;margin:24px 24px 0;border-bottom:0.5px solid var(--border);}
    .tab-btn{flex:1;padding:10px;background:none;border:none;font-family:'Zen Kaku Gothic New',sans-serif;font-size:13px;color:var(--ink3);cursor:pointer;transition:all .15s;border-bottom:2px solid transparent;margin-bottom:-0.5px;}
    .tab-btn.active{color:var(--acc);border-bottom-color:var(--acc);font-weight:500;}
    .tab-panel{display:none;padding:20px 24px 28px;}
    .tab-panel.active{display:block;}
    .field{margin-bottom:14px;}
    .field label{display:block;font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--ink3);text-transform:uppercase;margin-bottom:6px;}
    .field input{width:100%;padding:10px 14px;border:0.5px solid var(--border);border-radius:10px;font-size:14px;color:var(--ink);background:var(--bg);font-family:'Zen Kaku Gothic New',sans-serif;transition:border-color .15s;}
    .field input:focus{outline:none;border-color:var(--acc2);}
    .err{font-size:12px;color:#b85a42;margin-bottom:12px;min-height:18px;}
    .submit-btn{width:100%;padding:13px;background:var(--acc);color:#fff;border:none;border-radius:var(--r);font-family:'Noto Serif JP',serif;font-size:14px;font-weight:500;cursor:pointer;letter-spacing:.06em;transition:opacity .15s;}
    .submit-btn:hover{opacity:.88;}
    .submit-btn:disabled{opacity:.4;cursor:not-allowed;}
    .success-msg{text-align:center;padding:20px 0;}
    .success-icon{font-size:36px;margin-bottom:14px;}
    .success-title{font-family:'Noto Serif JP',serif;font-size:16px;font-weight:500;color:var(--ink);margin-bottom:8px;}
    .success-sub{font-size:12px;color:var(--ink3);line-height:1.7;}
  </style>
</head>
<body>
  <div class="card">
    <div class="card-head">
      <div class="logo">Yonder</div>
      <div class="logo-sub">COMPLETED NOVELS ONLY</div>
      <div class="tagline">埋もれた名作と、出会う場所</div>
    </div>
    <div class="tabs">
      <button class="tab-btn active" id="tab-login" onclick="switchTab('login')">ログイン</button>
      <button class="tab-btn" id="tab-register" onclick="switchTab('register')">新規登録</button>
    </div>
    <div class="tab-panel active" id="panel-login">
      <div class="field"><label>メールアドレス</label><input type="email" id="login-email" placeholder="your@email.com"></div>
      <div class="field"><label>パスワード</label><input type="password" id="login-password" placeholder="••••••••"></div>
      <div class="err" id="login-err"></div>
      <button class="submit-btn" id="login-btn" onclick="login()">ログイン</button>
      <div style="text-align:center;margin-top:12px;">
        <a href="#" onclick="showReset()" style="font-size:12px;color:var(--ink3);text-decoration:none;">パスワードを忘れた方はこちら</a>
      </div>
    </div>
    <div class="tab-panel" id="panel-reset" style="display:none;padding:20px 24px 28px;">
      <div style="font-family:'Noto Serif JP',serif;font-size:15px;font-weight:500;color:var(--ink);margin-bottom:6px;">パスワードをリセット</div>
      <div style="font-size:12px;color:var(--ink3);margin-bottom:16px;line-height:1.7;">登録したメールアドレスにリセット用のリンクを送信します</div>
      <div class="field"><label>メールアドレス</label><input type="email" id="reset-email" placeholder="your@email.com"></div>
      <div class="err" id="reset-err"></div>
      <button class="submit-btn" id="reset-btn" onclick="sendReset()">リセットメールを送信</button>
      <div style="text-align:center;margin-top:12px;">
        <a href="#" onclick="hideReset()" style="font-size:12px;color:var(--ink3);text-decoration:none;">← ログインに戻る</a>
      </div>
    </div>

    <div class="tab-panel" id="panel-register">
      <div class="field"><label>メールアドレス</label><input type="email" id="reg-email" placeholder="your@email.com"></div>
      <div class="field"><label>パスワード（8文字以上）</label><input type="password" id="reg-password" placeholder="••••••••"></div>
      <div class="field"><label>パスワード（確認）</label><input type="password" id="reg-password2" placeholder="••••••••"></div>
      <div class="err" id="reg-err"></div>
      <button class="submit-btn" id="reg-btn" onclick="register()">新規登録</button>
    </div>
  </div>
  <div style="text-align:center;margin-top:20px;display:flex;justify-content:center;gap:16px;">
    <a href="about.html" style="font-size:12px;color:var(--ink3);text-decoration:none;">Yonderとは</a>
    <a href="terms.html" style="font-size:12px;color:var(--ink3);text-decoration:none;">利用規約</a>
    <a href="privacy.html" style="font-size:12px;color:var(--ink3);text-decoration:none;">プライバシーポリシー</a>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
