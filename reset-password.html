<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yonder - パスワードリセット</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    body{display:flex;align-items:center;justify-content:center;padding:20px;min-height:100vh;}
    .card{width:100%;max-width:400px;background:#fff;border:0.5px solid var(--border);border-radius:20px;overflow:hidden;padding:28px 24px;}
    .logo{font-family:'Noto Serif JP',serif;font-size:24px;font-weight:700;color:var(--acc);text-align:center;margin-bottom:20px;}
    .title{font-family:'Noto Serif JP',serif;font-size:16px;font-weight:500;color:var(--ink);margin-bottom:6px;}
    .sub{font-size:12px;color:var(--ink3);margin-bottom:20px;line-height:1.7;}
    .field{margin-bottom:14px;}
    .field label{display:block;font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--ink3);text-transform:uppercase;margin-bottom:6px;}
    .field input{width:100%;padding:10px 14px;border:0.5px solid var(--border);border-radius:10px;font-size:14px;color:var(--ink);background:var(--bg);font-family:'Zen Kaku Gothic New',sans-serif;transition:border-color .15s;}
    .field input:focus{outline:none;border-color:var(--acc2);}
    .err{font-size:12px;color:#b85a42;margin-bottom:12px;min-height:18px;}
    .submit-btn{width:100%;padding:13px;background:var(--acc);color:#fff;border:none;border-radius:var(--r);font-family:'Noto Serif JP',serif;font-size:14px;font-weight:500;cursor:pointer;letter-spacing:.06em;transition:opacity .15s;}
    .submit-btn:hover{opacity:.88;}
    .submit-btn:disabled{opacity:.4;cursor:not-allowed;}
    .success-msg{text-align:center;padding:20px 0;}
    .success-icon{font-size:36px;margin-bottom:14px;}
    .success-title{font-family:'Noto Serif JP',serif;font-size:16px;font-weight:500;color:var(--ink);margin-bottom:8px;}
    .success-sub{font-size:12px;color:var(--ink3);line-height:1.7;}
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">Yonder</div>
    <div id="reset-form">
      <div class="title">新しいパスワードを設定</div>
      <div class="sub">8文字以上のパスワードを入力してください</div>
      <div class="field"><label>新しいパスワード</label><input type="password" id="new-password" placeholder="••••••••"></div>
      <div class="field"><label>パスワード（確認）</label><input type="password" id="new-password2" placeholder="••••••••"></div>
      <div class="err" id="reset-err"></div>
      <button class="submit-btn" id="reset-btn" onclick="updatePassword()">パスワードを更新する</button>
    </div>
    <div id="reset-done" style="display:none" class="success-msg">
      <div class="success-icon">✅</div>
      <div class="success-title">パスワードを更新しました</div>
      <div class="success-sub" style="margin-bottom:20px;">新しいパスワードでログインしてください</div>
      <a href="login.html" style="display:inline-block;padding:12px 24px;background:var(--acc);color:#fff;border-radius:var(--r);font-family:'Noto Serif JP',serif;font-size:14px;text-decoration:none;">ログイン画面へ</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script>
    async function updatePassword() {
      const p1 = document.getElementById('new-password').value;
      const p2 = document.getElementById('new-password2').value;
      const errEl = document.getElementById('reset-err');
      const btn = document.getElementById('reset-btn');
      if (!p1 || !p2) { errEl.textContent = 'パスワードを入力してください'; return; }
      if (p1.length < 8) { errEl.textContent = 'パスワードは8文字以上にしてください'; return; }
      if (p1 !== p2) { errEl.textContent = 'パスワードが一致しません'; return; }
      btn.disabled = true; btn.textContent = '更新中...'; errEl.textContent = '';
      const { error } = await sb.auth.updateUser({ password: p1 });
      if (error) {
        errEl.textContent = '更新に失敗しました。もう一度お試しください。';
        btn.disabled = false; btn.textContent = 'パスワードを更新する';
        return;
      }
      document.getElementById('reset-form').style.display = 'none';
      document.getElementById('reset-done').style.display = 'block';
    }
  </script>
</body>
</html>
